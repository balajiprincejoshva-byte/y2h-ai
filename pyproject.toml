[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "y2h-ppi"
version = "0.1.0"
description = "AI-Driven Computational Platform for Yeast Protein-Protein Interaction Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
]

[project.scripts]
y2h-ppi = "y2h_ppi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

random_seed: 42

baseline:
  logistic_regression:
    max_iter: 1000
    C: 1.0
  random_forest:
    n_estimators: 100
    max_depth: 12
    random_state: 42
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    random_state: 42

mlp:
  hidden_dims: [256, 128, 64]
  dropout: 0.2
  learning_rate: 0.001
  epochs: 30
  batch_size: 64

output_dir: "data/processed/saved_models"
